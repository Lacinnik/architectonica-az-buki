name: Links

# Pull requests and pushes check links between files in the repository.
# The weekly run also checks external links, including the other ecosystem repositories.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--max-retries 3' || '--offline' }}
            --no-progress
            --exclude-path node_modules
            './**/*.md'

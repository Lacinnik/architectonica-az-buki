name: Publish Subject Core

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/subject-core-pages.yml"
      - "subject-core/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package static application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Subject Core
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./subject-core

  deploy:
    name: Deploy public page
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
